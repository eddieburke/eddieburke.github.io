<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Links</title>
</head>
<body>
<main id="links" style="position: relative; min-height: 100vh;">
<a href="./911archhivecapture/" style="position: absolute;">Archive Pocket</a>
<a href="./ticket.html" style="position: absolute;">Train ticket</a>
</main>
<script>
const seed = 9112001;
let state = seed >>> 0;

function random() {
  state += 0x6D2B79F5;
  let value = state;
  value = Math.imul(value ^ value >>> 15, value | 1);
  value ^= value + Math.imul(value ^ value >>> 7, value | 61);
  return ((value ^ value >>> 14) >>> 0) / 4294967296;
}

document.querySelectorAll("#links a").forEach(link => {
  link.style.left = `${5 + random() * 90}%`;
  link.style.top = `${5 + random() * 90}%`;
  link.style.transform = `translate(-50%, -50%) rotate(${random() * 36 - 18}deg)`;
});
</script>
</body>
</html>
