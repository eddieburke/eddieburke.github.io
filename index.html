<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f4f0e8">
<title>Links</title>
<style>
:root {
  color-scheme: light;
  font-family: Arial, Helvetica, sans-serif;
  background: #f4f0e8;
  color: #171717;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body { min-height: 100svh; overflow-x: hidden; }
header {
  position: relative;
  z-index: 2;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
  padding: 1rem 1.25rem;
  border-bottom: 1px solid rgba(23, 23, 23, .22);
  font-size: .8rem;
  letter-spacing: .08em;
  text-transform: uppercase;
}
header a { color: inherit; text-decoration-thickness: 1px; text-underline-offset: 4px; }
#canvas {
  position: relative;
  min-height: calc(100svh - 3.5rem);
  overflow: hidden;
  isolation: isolate;
  background-image:
    radial-gradient(ellipse at 17% 28%, rgba(247, 87, 47, .12), transparent 24%),
    radial-gradient(ellipse at 81% 72%, rgba(26, 98, 179, .13), transparent 25%),
    radial-gradient(ellipse at 68% 17%, rgba(244, 190, 45, .13), transparent 22%);
}
#canvas::before {
  position: absolute;
  z-index: -1;
  inset: 0;
  background-image: radial-gradient(rgba(23, 23, 23, .22) .6px, transparent .6px);
  background-size: 15px 15px;
  content: "";
  opacity: .22;
}
.link {
  position: absolute;
  display: block;
  max-width: min(30rem, 72vw);
  padding: .16em .3em .22em;
  color: var(--ink);
  font-size: var(--size);
  font-weight: 700;
  line-height: 1.08;
  text-decoration: none;
  text-wrap: balance;
  transform: translate(-50%, -50%) rotate(var(--tilt));
  transform-origin: center;
  transition: transform 150ms ease, background-color 150ms ease;
  overflow-wrap: anywhere;
}
.link::after {
  position: absolute;
  z-index: -1;
  inset: 0;
  border: 1px solid currentColor;
  border-radius: 50%;
  content: "";
  opacity: .55;
  transform: rotate(-4deg) scale(1.08, 1.35);
}
.link:hover, .link:focus-visible {
  z-index: 1;
  background: #fff7;
  outline: 2px solid currentColor;
  outline-offset: 4px;
  transform: translate(-50%, -50%) rotate(0deg) scale(1.1);
}
#empty {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  padding: 2rem;
  color: rgba(23, 23, 23, .45);
  font-size: clamp(1rem, 2vw, 1.5rem);
  text-align: center;
  pointer-events: none;
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: .01ms !important; }
}
</style>
</head>
<body>
<header>
  <span>Links</span>
  <a href="ticket.html">Train ticket ↗</a>
</header>
<main id="canvas" aria-label="Scattered links">
  <div id="empty">Your links will land here.</div>
</main>
<script>
const links = [{ label: "Archive Pocket", url: "./911archhivecapture/" }];
const colors = ["#d63d27", "#164fa3", "#13734b", "#a33e8d", "#9b6a00", "#171717"];
const canvas = document.getElementById("canvas");
const empty = document.getElementById("empty");

function scatterLinks() {
  const entries = [...links].sort(() => Math.random() - 0.5);
  empty.hidden = entries.length > 0;
  entries.forEach((entry, index) => {
    const link = document.createElement("a");
    const column = index % 4;
    const row = Math.floor(index / 4);
    const columns = Math.min(4, entries.length);
    const rows = Math.ceil(entries.length / 4);
    const left = 9 + column * (82 / Math.max(1, columns - 1)) + (Math.random() * 12 - 6);
    const top = 12 + row * (76 / Math.max(1, rows - 1)) + (Math.random() * 12 - 6);
    link.className = "link";
    link.href = entry.url;
    link.textContent = entry.label;
    link.target = "_blank";
    link.rel = "noopener noreferrer";
    link.style.left = `${Math.max(5, Math.min(95, left))}%`;
    link.style.top = `${Math.max(7, Math.min(93, top))}%`;
    link.style.setProperty("--size", `${16 + Math.random() * 22}px`);
    link.style.setProperty("--tilt", `${Math.random() * 34 - 17}deg`);
    link.style.setProperty("--ink", colors[Math.floor(Math.random() * colors.length)]);
    canvas.appendChild(link);
  });
}

scatterLinks();
</script>
</body>
</html>
