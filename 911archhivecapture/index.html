<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f5f5">
  <meta name="description" content="Save and search source links.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="app.css">
  <title>Archive Pocket</title>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="app-header">
    <h1>Archive Pocket</h1>
    <nav aria-label="Pages">
      <button class="nav-item active" data-view="library" aria-current="page">Library <span id="entryCount">0</span></button>
      <button class="nav-item" data-view="add">New capture</button>
    </nav>
  </header>
  <main id="main">
    <h2 id="viewTitle">Library</h2>
    <section id="libraryView" class="view active-view" aria-label="Library">
      <div class="library-toolbar">
        <input id="searchInput" type="search" aria-label="Search captures" placeholder="Search">
        <select id="sourceFilter" aria-label="Source"><option value="">All sources</option><option value="facebook">Facebook</option><option value="instagram">Instagram</option><option value="threads">Threads</option><option value="linkedin">LinkedIn</option><option value="archive">Internet Archive</option><option value="wayback">Wayback Machine</option><option value="other">Other</option></select>
        <select id="sortSelect" aria-label="Sort"><option value="newest">Newest saved</option><option value="posted">Date posted</option><option value="title">Title A–Z</option></select>
      </div>
      <div class="toolbar">
        <label class="secondary-button file-button">Import JSON<input id="importFile" type="file" accept="application/json,.json"></label>
        <button id="exportAll" class="secondary-button">Export JSON</button>
        <small id="exportInfo">0 records</small>
      </div>
      <details class="settings">
        <summary>GitHub &amp; helper settings</summary>
        <form id="settingsForm">
          <div class="two-columns">
            <label>Repository<input id="repoName" placeholder="owner/repository" pattern="[^/\s]+/[^/\s]+"></label>
            <label>Branch<input id="repoBranch" value="main"></label>
            <label>Catalog path<input id="repoPath" value="data/archive.json"></label>
            <label>Media folder<input id="mediaPath" value="media"></label>
          </div>
          <label>Helper ID <small>Optional; older Chromium helpers only</small><input id="extensionId" autocomplete="off"></label>
          <button type="submit" class="secondary-button">Save settings</button>
        </form>
        <div class="sync-controls">
          <label>GitHub token <small>Contents write permission; not saved</small><input id="githubToken" type="password" autocomplete="off"></label>
          <button id="syncGithub" class="secondary-button" type="button">Sync JSON to GitHub</button>
          <small id="syncStatus" role="status"></small>
        </div>
      </details>
      <p id="emptyLibrary" class="empty-state">No captures. <button class="text-button" data-go="add">Add one</button></p>
      <div id="entryGrid" class="entry-grid" aria-live="polite"></div>
    </section>
    <section id="addView" class="view" aria-label="Capture editor">
      <form id="captureForm">
        <label>Source URL
          <div class="url-input"><input id="sourceUrl" name="sourceUrl" type="url" required autocomplete="url"><button type="button" id="openSource" class="secondary-button">Open</button></div>
          <small id="urlHint"></small>
        </label>
        <div class="source-capture-row">
          <button type="button" class="secondary-button" id="autoCapture">Capture with helper</button>
          <button type="button" class="text-button" id="extractPasted">Paste HTML</button>
          <small id="captureStatus" role="status"></small>
        </div>
        <div class="two-columns">
          <label>Title<input id="title" name="title"></label>
          <label>Author<input id="person" name="person"></label>
          <label>Date posted<input id="postedDate" name="postedDate" type="date"><small id="postedDateDetail"></small></label>
          <label>Source<select id="sourceType" name="sourceType"><option value="other">Other</option><option value="facebook">Facebook</option><option value="instagram">Instagram</option><option value="threads">Threads</option><option value="linkedin">LinkedIn</option><option value="archive">Internet Archive</option><option value="wayback">Wayback Machine</option></select></label>
        </div>
        <label>Post text / notes<textarea id="notes" name="notes" rows="8"></textarea></label>
        <label>Tags <small>Comma-separated</small><input id="tags" name="tags"></label>
        <div class="form-actions"><button class="primary-button" type="submit">Save</button><button type="reset" class="text-button">Clear</button><button type="button" class="text-button" data-go="library">Cancel</button></div>
      </form>
    </section>
  </main>
  <dialog id="entryDialog" class="dialog entry-dialog"><button class="dialog-close" data-close-dialog aria-label="Close">×</button><div id="entryDialogContent"></div></dialog>
  <dialog id="pasteDialog" class="dialog"><button class="dialog-close" data-close-dialog aria-label="Close">×</button><h2>Paste HTML</h2><textarea id="htmlPaste" rows="12" aria-label="HTML or page text"></textarea><div class="form-actions"><button id="parsePasted" class="primary-button">Extract</button><button class="text-button" data-close-dialog>Cancel</button></div></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="helper-client.js"></script>
  <script src="app.js"></script>
</body>
</html>
